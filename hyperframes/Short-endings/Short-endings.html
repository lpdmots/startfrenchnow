<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Start French Now · Short Endings</title>
        <style>
            :root {
                --secondary-2: #1c92ff;
                --secondary-4: #ff4a60;
                --secondary-5: #00c9a7;
                --secondary-6: #ee1a24;
                --secondary-shade-2: #add8ff;
                --secondary-shade-4: #ffb8bf;
                --secondary-shade-5: #dbf8c9;
                --neutral-100: #ffffff;
                --neutral-200: #faf9f6;
                --neutral-300: #f1f0ee;
                --neutral-500: #878787;
                --neutral-700: #393939;
                --neutral-800: #0b0b0b;
                --shell-radius: 42px;
                --frame-radius: 34px;
                --shadow: 0 28px 80px rgba(11, 11, 11, 0.14);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                min-height: 100%;
            }

            body {
                font-family: Poppins, "Avenir Next", "Segoe UI", sans-serif;
                background:
                    radial-gradient(circle at top, rgba(28, 146, 255, 0.14), transparent 28%),
                    linear-gradient(180deg, #f7f4ee 0%, #ffffff 100%);
                color: var(--neutral-800);
                padding: 32px 18px 56px;
            }

            .page {
                max-width: 1480px;
                margin: 0 auto;
            }

            .screen-block {
                display: flex;
                flex-direction: column;
                gap: 12px;
                align-items: center;
            }

            .screen-meta {
                width: min(100%, 460px);
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                color: var(--neutral-500);
                font-size: 12px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .screen-role {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-weight: 700;
            }

            .screen-role::before {
                content: "";
                width: 8px;
                height: 8px;
                border-radius: 999px;
                background: var(--secondary-6);
                box-shadow: 0 0 0 6px rgba(238, 26, 36, 0.12);
            }

            .frame-shell {
                width: min(100%, 460px);
                padding: 14px;
                border-radius: var(--shell-radius);
                background: rgba(255, 255, 255, 0.86);
                border: 1px solid rgba(11, 11, 11, 0.06);
                box-shadow: var(--shadow);
                backdrop-filter: blur(12px);
            }

            .frame {
                position: relative;
                width: 100%;
                aspect-ratio: 9 / 16;
                overflow: hidden;
                border-radius: var(--frame-radius);
                isolation: isolate;
                background:
                    linear-gradient(135deg, transparent 0 58%, rgba(238, 26, 36, 0.96) 58% 100%),
                    radial-gradient(circle at 10% 18%, rgba(28, 146, 255, 0.2), transparent 20%),
                    radial-gradient(circle at 88% 15%, rgba(0, 201, 167, 0.16), transparent 18%),
                    linear-gradient(180deg, #faf9f6 0%, #f4f1ea 100%);
            }

            .frame::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                border: 1px solid rgba(255, 255, 255, 0.14);
                pointer-events: none;
                z-index: 10;
            }

            .logo-lockup {
                position: absolute;
                top: 34px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 7;
                width: 78px;
                aspect-ratio: 1.5 / 1;
            }

            .logo-part-1 {
                position: relative;
                width: 100%;
                height: auto;
                display: block;
            }

            .logo-part-2 {
                position: absolute;
                top: -18px;
                left: -21px;
                width: 34%;
                height: auto;
                display: block;
            }

            .brand-header {
                position: absolute;
                top: 118px;
                left: 22px;
                right: 22px;
                z-index: 7;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                text-align: center;
            }

            .brand-name {
                margin: 0;
                color: var(--neutral-800);
                font-size: 1.78rem;
                line-height: 0.96;
                font-weight: 900;
                letter-spacing: 0;
            }

            .brand-start {
                color: var(--secondary-2);
            }

            .brand-now {
                color: var(--secondary-6);
            }

            .brand-site {
                margin: 0;
                color: var(--neutral-700);
                font-size: 1.08rem;
                line-height: 1;
                font-weight: 800;
                letter-spacing: 0;
            }

            .content {
                position: absolute;
                left: 24px;
                right: 24px;
                top: 216px;
                z-index: 7;
                display: flex;
                flex-direction: column;
                gap: 0;
            }

            .title {
                margin: 0;
                color: var(--neutral-800);
                font-size: 4rem;
                line-height: 0.86;
                font-weight: 900;
                letter-spacing: 0;
                max-width: 250px;
                transform: translateX(30px);
            }

            .title-fide {
                display: inline-block;
                margin-top: 8px;
                padding: 4px 12px 8px;
                background: var(--secondary-6);
                color: var(--neutral-100);
                border-radius: 16px;
                transform: rotate(-2deg);
            }

            .professor-cluster {
                position: absolute;
                right: -34px;
                bottom: 36px;
                width: 336px;
                height: 336px;
                z-index: 6;
            }

            .bullet-chip {
                position: absolute;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 11px 13px;
                border-radius: 18px;
                background: var(--neutral-100);
                color: var(--neutral-800);
                font-size: 1.06rem;
                line-height: 1;
                font-weight: 800;
                white-space: nowrap;
            }

            .bullet-chip::before {
                content: "";
                width: 13px;
                height: 13px;
                flex: 0 0 13px;
                border-radius: 999px;
                background: var(--secondary-5);
                box-shadow: none;
            }

            .bullet-chip.exam::before {
                background: var(--secondary-4);
            }

            .bullet-chip.learning::before {
                background: var(--secondary-2);
            }

            .bullet-chip.private::before {
                background: var(--secondary-5);
            }

            .bullet-chip.exam {
                left: -42px;
                top: 20px;
            }

            .bullet-chip.learning {
                left: -70px;
                top: 94px;
            }

            .bullet-chip.private {
                left: -114px;
                top: 168px;
            }

            .professor-wrap {
                position: absolute;
                right: 0;
                bottom: 0;
                z-index: 1;
                width: 278px;
                height: 278px;
                border-radius: 999px;
                overflow: hidden;
                box-shadow: 0 18px 38px rgba(11, 11, 11, 0.16);
                background: var(--neutral-100);
            }

            .professor-wrap::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.52);
                z-index: 2;
                pointer-events: none;
            }

            .professor-wrap img {
                width: 100%;
                height: 100%;
                display: block;
                object-fit: cover;
                object-position: center top;
            }

            @media (max-width: 540px) {
                body {
                    padding-inline: 12px;
                }

                .frame-shell,
                .screen-meta {
                    width: min(100%, 430px);
                }

                .logo-lockup {
                    top: 30px;
                    width: 72px;
                }

                .logo-part-2 {
                    top: -16px;
                    left: -19px;
                }

                .brand-header {
                    top: 108px;
                    left: 18px;
                    right: 18px;
                    gap: 6px;
                }

                .brand-name {
                    font-size: 1.42rem;
                }

                .brand-site {
                    font-size: 0.92rem;
                }

                .content {
                    left: 20px;
                    right: 20px;
                    top: 196px;
                    gap: 0;
                }

                .title {
                    font-size: 3.16rem;
                    max-width: 210px;
                    transform: translateX(18px);
                }

                .professor-cluster {
                    right: -40px;
                    bottom: 34px;
                    width: 284px;
                    height: 284px;
                }

                .bullet-chip {
                    font-size: 0.96rem;
                    padding: 10px 12px;
                    border-radius: 16px;
                }

                .bullet-chip.exam {
                    left: -38px;
                    top: 16px;
                }

                .bullet-chip.learning {
                    left: -58px;
                    top: 80px;
                }

                .bullet-chip.private {
                    left: -92px;
                    top: 144px;
                }

                .professor-wrap {
                    right: 0;
                    bottom: 0;
                    width: 232px;
                    height: 232px;
                }
            }
        </style>
    </head>
    <body>
        <main class="page">
            <section class="screen-block">
                <div class="screen-meta">
                    <span class="screen-role">CTA Site</span>
                    <span>Short-endings · 1080 × 1920</span>
                </div>

                <div class="frame-shell">
                    <div class="frame">
                    <div class="logo-lockup" aria-label="Logo Start French Now">
                        <img class="logo-part-1" src="assets/logo-part-1.png" alt="Start French Now logo part 1" />
                        <img class="logo-part-2" src="assets/logo-part-2.png" alt="Start French Now logo part 2" />
                    </div>

                    <div class="brand-header">
                        <p class="brand-name"><span class="brand-start">START</span> FRENCH <span class="brand-now">NOW</span></p>
                        <p class="brand-site">startfrenchnow.ch</p>
                    </div>

                    <div class="content">
                        <h1 class="title">Expert<br /><span class="title-fide">FIDE</span></h1>
                    </div>

                    <div class="professor-cluster">
                        <div class="bullet-chip exam">Examens blancs</div>
                        <div class="bullet-chip learning">E-learning</div>
                        <div class="bullet-chip private">Cours privés</div>
                        <div class="professor-wrap">
                            <img src="assets/yohann-bleu.png" alt="Professeur Start French Now" />
                        </div>
                    </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
